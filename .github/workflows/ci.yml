name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # No conecta a nada real: `prisma generate` es puro codegen desde el
      # schema, y los tests mockean @/lib/prisma — esto solo evita que algo
      # truene por DATABASE_URL undefined.
      DATABASE_URL: "postgresql://user:password@localhost:5432/tpeaks_ci"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
